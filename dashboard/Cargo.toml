[package]
name = "hermes-guard-dashboard"
version = "0.1.0"
edition = "2021"
description = "Pop-up dashboard for a running hermes-update-guard update, in the Hermes desktop palette."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = true
strip = true
