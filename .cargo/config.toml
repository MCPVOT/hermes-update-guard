# Static CRT on Windows ONLY -> standalone exe (no runtime DLLs) for cron/background use.
# Scoped per-target so Linux/macOS builds are unaffected (crt-static is not valid there).
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]