name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Package artifacts
        shell: bash
        run: |
          set -e
          TAG=${GITHUB_REF_NAME#v}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE="target/release/hermes-update-guard.exe"
            BIN="hermes-update-guard-${TAG}-x86_64-pc-windows-msvc.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            EXE="target/release/hermes-update-guard"
            BIN="hermes-update-guard-${TAG}-x86_64-apple-darwin"
          else
            EXE="target/release/hermes-update-guard"
            BIN="hermes-update-guard-${TAG}-x86_64-unknown-linux-gnu"
          fi
          mv "$EXE" "$BIN"
          echo "ARTIFACT=$BIN" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}