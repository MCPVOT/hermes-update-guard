[package]
name = "hermes-update-guard"
version = "0.1.1"
edition = "2021"
description = "Guardian orchestrator for safe Hermes Agent updates: preflight, WAL-safe backup, provider-drift tripwire, update, post-verify, restore."
license = "MIT"
readme = "README.md"
repository = "https://github.com/YOUR_USERNAME/hermes-update-guard"
homepage = "https://github.com/YOUR_USERNAME/hermes-update-guard"
keywords = ["hermes", "agent", "update", "backup", "guard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[profile.release]
lto = true
strip = true