[package]
name = "hermes-update-guard"
version = "0.3.4"
edition = "2021"
description = "Guardian orchestrator for safe Hermes Agent updates: preflight, WAL-safe backup, provider-drift tripwire, update, post-verify, restore."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MCPVOT/hermes-update-guard"
homepage = "https://github.com/MCPVOT/hermes-update-guard"
keywords = ["hermes", "agent", "update", "backup", "guard"]
categories = ["command-line-utilities", "development-tools"]
# The Tauri dashboard is a separate, optional crate: it needs WebView2 and pulls
# a GUI toolchain that the CLI must never require. Excluded so `cargo package`
# and the CLI's CI stay lean.
exclude = ["dashboard"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
